<!DOCTYPE html>
<html>
<head>
    <title>K-12 App Tests</title>
    <link rel="shortcut icon" type="image/png" href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/4.5.0/jasmine_favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/4.5.0/jasmine.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/4.5.0/jasmine.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/4.5.0/jasmine-html.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/4.5.0/boot.min.js"></script>
    
    <!-- Mock Styles to prevent visibility issues during test -->
    <style>
        #test-container { display: none; }
    </style>
</head>
<body>
    <!-- Mock DOM for tests -->
    <div id="test-container">
        <!-- Hero Section -->
        <h1 id="page-title"></h1>
        <img id="hero-bg-img" />
        <h2 id="hero-title"></h2>
        <p id="hero-description"></p>
        <div id="hero-buttons-container"></div>
        <button id="select-space-btn"></button> <!-- Fallback if needed -->
        <button id="modal-close-btn"></button>
        <button id="modal-back-btn"></button>
        <button id="popover-view-btn"></button>
        <button id="popover-close-btn"></button>

        <!-- Modal & Detail Elements -->
        <div id="space-selection-modal">
            <div class="space-selection-modal-space-name"></div>
            <div id="modal-system-name"></div>
            <button class="space-selection-modal-tab" data-tab="overview"></button>
            <button class="space-selection-modal-tab" data-tab="system-equipment"></button>
            <div id="overview-content" class="tab-content"></div>
            <div id="system-equipment-content" class="tab-content"></div>
            <div id="design-narrative-content" class="tab-content"></div>
        </div>
        
        <div id="detail-title"></div>
        <div id="detail-description"></div>
        <div class="product-carousel"></div>
        
        <!-- SVG Objects -->
        <object id="building-svg-object"></object>
        <object id="building-space-overlay-object"></object>
        <object id="space-svg-object"></object>
        
        <!-- Popover -->
        <div id="space-popover"></div>
        <div class="carousel-live-region"></div>
    </div>

    <!-- App Code -->
    <script src="Content/js/k-12-app.js"></script>

    <!-- Tests -->
    <script>
        describe("K-12 App Architecture", function() {
            let service, model, view, controller;

            beforeEach(function() {
                // Re-instantiate for each test
                service = new SpaceService();
                model = new SpaceModel();
                view = new SpaceView();
                controller = new SpaceController(service, model, view);
                
                // Reset DOM elements
                document.getElementById('page-title').textContent = '';
                document.getElementById('hero-buttons-container').innerHTML = '';
            });

            describe("SpaceService", function() {
                it("should fetch enhanced data structure including pageMetadata", async function() {
                    const data = await service.fetchData();
                    expect(data).toBeDefined();
                    expect(data.pageMetadata).toBeDefined();
                    expect(data.pageMetadata.title).toBe("K-12 School");
                    expect(data.pageMetadata.heroSection).toBeDefined();
                    expect(data.spaces.length).toBeGreaterThan(0);
                });
            });

            describe("SpaceModel", function() {
                it("should store and retrieve page metadata", function() {
                    const mockMeta = { title: "Test" };
                    model.setPageMetadata(mockMeta);
                    expect(model.getPageMetadata()).toBe(mockMeta);
                });
            });

            describe("SpaceView", function() {
                it("should render hero content from metadata", function() {
                    const metadata = {
                        title: "Test Page",
                        heroSection: {
                            backgroundImage: "test.png",
                            title: "Test Hero",
                            description: "Test Desc",
                            actions: [
                                { type: "primary", label: "Action 1", actionId: "btn-1", iconClass: "icon.png" }
                            ]
                        }
                    };
                    
                    view.renderPageContent(metadata);
                    
                    expect(document.getElementById('page-title').textContent).toBe("Test Page");
                    expect(document.getElementById('hero-title').textContent).toBe("Test Hero");
                    expect(document.getElementById('hero-description').innerHTML).toBe("Test Desc");
                    
                    const btnContainer = document.getElementById('hero-buttons-container');
                    expect(btnContainer.children.length).toBe(1);
                    expect(btnContainer.firstChild.id).toBe("btn-1");
                    expect(btnContainer.firstChild.textContent).toContain("Action 1");
                });
            });

            describe("SpaceController", function() {
                it("should initialize, fetch data, and update view", async function() {
                    spyOn(service, 'fetchData').and.callThrough();
                    spyOn(view, 'renderPageContent').and.callThrough();
                    spyOn(controller, 'bindEvents').and.callThrough();
                    
                    await controller.init();
                    
                    expect(service.fetchData).toHaveBeenCalled();
                    expect(model.getPageMetadata()).toBeDefined();
                    expect(view.renderPageContent).toHaveBeenCalled();
                    expect(controller.bindEvents).toHaveBeenCalled();
                });
            });
        });
    </script>
</body>
</html>
